<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StealthChampions — Privacy Policies</title>
  <style>
    :root {
      --bg: #0f0f14;
      --surface: #1a1a24;
      --border: #2a2a3a;
      --text: #e8e8ed;
      --text-muted: #9898a8;
      --accent: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 520px; margin: 0 auto; padding: 80px 24px; }
    h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px; text-align: center; }
    .subtitle { text-align: center; color: var(--text-muted); font-size: 15px; margin-bottom: 40px; }
    .card {
      display: block; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px 24px; margin-bottom: 12px;
      text-decoration: none; color: var(--text); transition: border-color 0.2s, transform 0.2s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card h2 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .card p { font-size: 13px; color: var(--text-muted); margin: 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Privacy Policies</h1>
    <p class="subtitle">StealthChampions browser extensions</p>
    <a class="card" href="./onfile/">
      <h2>📋 OnFile</h2>
      <p>Track what's on file per account — emails, phones, cards & more</p>
    </a>
    <a class="card" href="./aichatsweep/">
      <h2>🧹 AIChatSweep</h2>
      <p>Bulk manage conversations across AI chat platforms</p>
    </a>
  </div>
</body>
</html>
